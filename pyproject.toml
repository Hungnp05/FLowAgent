[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowagent"
version = "0.1.0"
description = "AI agent for task management and planning"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain-google-genai>=4.4",
    "langchain-groq>=1.1",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.15",
    "streamlit>=1.65",
    "plotly>=7.1",
    "pandas>=2.2",
    "scikit-learn>=1.9",
    "joblib>=1.4",
    "cryptography>=44",
    "fastembed>=0.9",
]

[project.scripts]
flowagent-reset-pin = "flowagent.security.reset_pin:main"
flowagent-collect-jira = "flowagent.ml.jira_collection:main"
flowagent-train-priority = "flowagent.ml.train_priority_model:main"
flowagent-generate-tasks = "flowagent.ml.synthetic_tasks:main"
flowagent-eval = "flowagent.evaluation.runner:main"
flowagent-eval-report = "flowagent.evaluation.report:main"

[project.optional-dependencies]
dev = ["pytest>=9.1", "ruff>=0.17"]
notebook = ["matplotlib>=3.9", "seaborn>=0.13", "nbformat>=5.10", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/flowagent/agent/prompts.py" = ["E501"]
"*.ipynb" = ["E402", "E501", "RUF001"]
"src/flowagent/ml/synthetic_tasks.py" = ["E501"]
